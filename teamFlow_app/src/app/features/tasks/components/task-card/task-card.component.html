<p-card class="task-card" [ngClass]="'status-' + task.status">
    <ng-template #header>
        <div class="card-accent"></div>
    </ng-template>

    <ng-template #title>
        <div class="task-heading">
            <span class="task-eyebrow">Task #{{ task.id }}</span>
            <h2>{{ task.title }}</h2>
        </div>
    </ng-template>

    <ng-template #subtitle>
        <p class="task-description">{{ task.description }}</p>
    </ng-template>

    <div class="task-details">
        <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="status-badge">{{ task.status }}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Priority</span>
            <span class="priority-badge" [ngClass]="'priority-' + task.priority">
                P{{ task.priority }}
            </span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Assignee</span>
            <span class="assignee">
                <span class="assignee-avatar">{{ (task.assignee || 'U').charAt(0).toUpperCase() }}</span>
                {{ task.assignee || 'Unassigned' }}
            </span>
        </div>
    </div>

    <ng-template #footer>
        <div class="task-actions">
            <p-button label="Mark Done" [disabled]="task.status === 'done'" (click)="onMarkDone()" severity="secondary" [outlined]="true" styleClass="action-button" />
            <p-button label="Delete" (click)="onDelete()" severity="danger" styleClass="action-button" />
        </div>
    </ng-template>
</p-card>
