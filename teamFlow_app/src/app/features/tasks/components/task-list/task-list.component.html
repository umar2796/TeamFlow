@if (tasks.length === 0) {
         <p class="empty-state">No tasks yet</p>
    }
 @else 
 {
      <div class="task-grid">
         @for (task of tasks; track task.id) {
            <app-task-card [task]="task" (statusChanged)="onStatusChanged($event)" (deleted)="onTaskDeleted($event)"></app-task-card>
         }
      </div>
 }
